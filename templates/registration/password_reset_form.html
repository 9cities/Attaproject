{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Reset Password</h2>
        <p>Masukkan email yang terdaftar. Instruksi reset akan dikirim ke email (ditampilkan di konsol pada mode development).</p>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Kirim Instruksi</button>
        </form>
    </div>
</div>
{% endblock %}
