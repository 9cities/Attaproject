{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Lupa Password</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <p>Masukkan username Anda:</p>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <button type="submit">Lanjut</button>
        </form>
    </div>
</div>
{% endblock %}
