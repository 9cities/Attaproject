{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <h2>Reset Password untuk {{ username }}</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <p>Pertanyaan: <b>{{ question }}</b></p>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="security_answer" placeholder="Jawaban" required>
            <input type="password" name="new_password" placeholder="Password baru" required>
            <input type="password" name="new_password2" placeholder="Konfirmasi password baru" required>
            <button type="submit">Simpan Password Baru</button>
        </form>
    </div>
</div>
{% endblock %}
