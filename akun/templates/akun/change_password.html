{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password</title>
    <link rel="stylesheet" href="{% static 'akun/css/style.css' %}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Ganti Password</h1>
        <h3>Ganti Password Akun Anda</h3>

        {% if error %}
            <div class="error" style="color:red; margin-bottom:15px; font-weight:bold; text-align:center;">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="old_password" placeholder="Password Lama" required>
            <input type="password" name="new_password" placeholder="Password Baru" required>
            <input type="password" name="new_password2" placeholder="Konfirmasi Password Baru" required>

            <button type="submit">Simpan Password Baru</button>
        </form>

        <p style="margin-top:20px;">
            <a href="{% url 'home' %}" style="display:inline-block; padding:8px 15px; background:var(--pink-light); color:var(--pink-dark); text-decoration:none; border-radius:5px;">Batal &amp; Kembali</a>
        </p>
    </div>
</div>

</body>
</html>
